<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" sizes="64x64" href="/favicon.ico?v=sky-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phòng trọ</title>
    <link rel="preload" href="/fonts/SF-Pro-Display-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- PWA: cho phép cài đặt lên màn hình chính điện thoại và chạy toàn màn hình (standalone). -->
    <link rel="manifest" href="/manifest.webmanifest?v=sky-1" />
    <meta name="theme-color" content="#0069a8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0069a8" media="(prefers-color-scheme: dark)" />
    <!-- iOS Safari "Thêm vào MH chính": icon + tiêu đề + chế độ standalone. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=sky-1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Phòng trọ" />
    <!-- Restore saved appearance before first paint to avoid a light/dark flash.
         Keys must match src/lib/colorMode.ts and src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var mode = localStorage.getItem('color-mode') || 'system'
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.classList.toggle('dark', isDark)
          root.dataset.theme = localStorage.getItem('color-theme') || 'neutral'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
