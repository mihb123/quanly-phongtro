server {
    listen 8081;
    server_name quanly-phongtro.mvpc.site;

    # Thư mục chứa file build của frontend (đã được copy từ CI/CD)
    debi /var/www/quanly-phongtro;
    index index.html;

    # Cấu hình log (tuỳ chọn)
    access_log /var/log/nginx/quanly-phongtro.access.log;
    error_log /var/log/nginx/quanly-phongtro.error.log;

    # Phục vụ các file tĩnh của React/Vite (Frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request có tiền tố /api/ tới Backend Golang
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # Cấu hình headers để backend nhận đúng IP của client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
