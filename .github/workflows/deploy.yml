name: Deploy QuanLyPhongTro

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    env:
      SERVICE_NAME: quanly-phongtro-api
      PROJECT_DIR: ${{ vars.PROJECT_DIR }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_GROUP: ${{ vars.DEPLOY_GROUP }}
      FRONTEND_DIR: ${{ vars.FRONTEND_DIR }}
      NGINX_SITE_NAME: ${{ vars.NGINX_SITE_NAME }}
      NGINX_AVAILABLE_DIR: ${{ vars.NGINX_AVAILABLE_DIR }}
      NGINX_ENABLED_DIR: ${{ vars.NGINX_ENABLED_DIR }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Set deployment variables
        run: bash "$GITHUB_WORKSPACE/scripts/deploy/set-env.sh"

      - name: Prepare source code
        run: bash "$GITHUB_WORKSPACE/scripts/deploy/prepare-source.sh"

      - name: Lint, generate mocks and run tests
        run: bash "$PROJECT_DIR/scripts/deploy/lint-test.sh"

      - name: Build backend and frontend
        run: bash "$PROJECT_DIR/scripts/deploy/build.sh"

      - name: Backup database, binary, and frontend
        run: bash "$PROJECT_DIR/scripts/deploy/backup.sh"

      - name: Run database migrations and seed
        run: bash "$PROJECT_DIR/scripts/deploy/database.sh"

      - name: Deploy backend, frontend, and nginx
        run: bash "$PROJECT_DIR/scripts/deploy/apply.sh"

      - name: Cleanup old backups
        run: bash "$PROJECT_DIR/scripts/deploy/cleanup.sh"
