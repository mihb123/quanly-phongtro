name: Deploy QuanLyPhongTro

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    env:
      SERVICE_NAME: quanly-phongtro-api

    steps:
      # ── Phase 0: Khởi tạo biến môi trường ──────────────
      - name: Set project directory
        run: echo "PROJECT_DIR=$HOME/quanly-phongtro" >> $GITHUB_ENV

      # ── Phase 1: Pull source code ──────────────────────
      - name: Pull latest source code
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 1] Pull source code"
          cd $PROJECT_DIR
          git fetch origin develop
          git reset --hard origin/develop

      # ── Phase 2: Lint & Build (verify trước khi đổi data) ─
      - name: Lint backend
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 2] Lint backend"
          cd $PROJECT_DIR
          go vet ./...

      - name: Build backend
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 2] Build backend"
          cd $PROJECT_DIR
          go mod download
          go build -o ${SERVICE_NAME}.new ./cmd/api

      - name: Lint and build frontend
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 2] Build frontend"
          cd $PROJECT_DIR/frontend
          if command -v pnpm &> /dev/null; then
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm build
          else
            npm install
            npm run lint
            npm run build
          fi

      # ── Phase 3: Backup (trước khi deploy) ─────────────
      - name: Backup database
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 3] Backup database"
          cd $PROJECT_DIR
          chmod +x scripts/backup-db.sh
          ./scripts/backup-db.sh

      - name: Backup current binary
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 3] Backup backend binary"
          cd $PROJECT_DIR
          mkdir -p backup/binary
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          GIT_HASH=$(git rev-parse --short HEAD~1 2>/dev/null || echo "unknown")
          if [[ -f "$SERVICE_NAME" ]]; then
            cp "$SERVICE_NAME" "backup/binary/${SERVICE_NAME}_${TIMESTAMP}_${GIT_HASH}"
            echo "✅ Backup binary thành công"
          else
            echo "⚠️  Không tìm thấy binary hiện tại, bỏ qua backup"
          fi

      - name: Backup current frontend
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 3] Backup frontend"
          cd $PROJECT_DIR
          mkdir -p backup/frontend
          FRONTEND_SRC="/var/www/quanly-phongtro"
          if [[ -d "$FRONTEND_SRC" ]] && [[ -n "$(ls -A "$FRONTEND_SRC" 2>/dev/null)" ]]; then
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            GIT_HASH=$(git rev-parse --short HEAD~1 2>/dev/null || echo "unknown")
            tar -czf "backup/frontend/frontend_${TIMESTAMP}_${GIT_HASH}.tar.gz" -C "$FRONTEND_SRC" .
            echo "✅ Backup frontend thành công"
          else
            echo "⚠️  Thư mục frontend rỗng hoặc không tồn tại, bỏ qua backup"
          fi

      # ── Phase 4: Database (chỉ chạy sau khi build OK) ──
      - name: Run database migrations and seed
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 4] Database migrations & seed"
          cd $PROJECT_DIR
          set -a && source .env && set +a
          $HOME/go/bin/migrate -path migrations -database "$POSTGRES_DSN" up
          go run ./cmd/seed/main.go

      # ── Phase 5: Deploy ────────────────────────────────
      - name: Deploy backend binary
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 5] Deploy backend binary"
          cd $PROJECT_DIR
          mv ${SERVICE_NAME}.new $SERVICE_NAME
          chmod +x $SERVICE_NAME

      - name: Deploy Nginx configuration
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 5] Deploy Nginx configuration"
          sudo /usr/bin/cp $PROJECT_DIR/nginx.conf /etc/nginx/sites-available/quanly-phongtro
          sudo /usr/sbin/nginx -t

      - name: Deploy frontend to Nginx
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 5] Deploy frontend"
          rsync -a --delete $PROJECT_DIR/frontend/dist/ /var/www/quanly-phongtro/
          sudo /usr/bin/systemctl reload nginx

      - name: Restart backend service
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 5] Restart backend service"
          sudo /usr/bin/systemctl restart $SERVICE_NAME
          sleep 2
          sudo /usr/bin/systemctl status $SERVICE_NAME --no-pager

      # ── Phase 6: Cleanup backups cũ ────────────────────
      - name: Cleanup old backups
        run: |
          source $PROJECT_DIR/scripts/setup-trap.sh "[Phase 6] Cleanup backups cũ"
          cd $PROJECT_DIR
          MAX_BACKUPS=5
          for dir in backup/binary backup/frontend; do
            if [[ -d "$dir" ]]; then
              FILE_COUNT=$(find "$dir" -maxdepth 1 -type f | wc -l)
              if [[ "$FILE_COUNT" -gt "$MAX_BACKUPS" ]]; then
                DELETE_COUNT=$((FILE_COUNT - MAX_BACKUPS))
                find "$dir" -maxdepth 1 -type f -printf '%T@ %p\n' \
                  | sort -n \
                  | head -n "$DELETE_COUNT" \
                  | awk '{print $2}' \
                  | xargs rm -f
                echo "🗑️  Đã xoá $DELETE_COUNT bản backup cũ trong $dir"
              fi
            fi
          done
          bash $PROJECT_DIR/scripts/notify-telegram.sh "🚀 Toàn bộ quá trình Deploy hoàn tất!"
